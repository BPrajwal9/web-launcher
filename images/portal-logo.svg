<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- 24K Royal Gold Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A7"/>
      <stop offset="25%" stop-color="#F3CA68"/>
      <stop offset="50%" stop-color="#D49D34"/>
      <stop offset="75%" stop-color="#F0BD50"/>
      <stop offset="100%" stop-color="#916824"/>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14223D"/>
      <stop offset="50%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#050912"/>
    </linearGradient>

    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5B964" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E5B964" stop-opacity="0"/>
    </radialGradient>

    <filter id="medallionShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Golden Glow -->
  <circle cx="200" cy="200" r="195" fill="url(#portalGlow)"/>

  <!-- Outer Heavy Bezel -->
  <circle cx="200" cy="200" r="185" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="7" filter="url(#medallionShadow)"/>

  <!-- Decorative Beaded Ring -->
  <circle cx="200" cy="200" r="168" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-dasharray="3, 7"/>
  <circle cx="200" cy="200" r="154" fill="#0A1224" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Circular Lettering Paths -->
  <path id="topArch" d="M 62,200 A 138,138 0 1,1 338,200" fill="none"/>
  <path id="bottomArch" d="M 338,200 A 138,138 0 0,1 62,200" fill="none"/>

  <text font-family="'Cinzel', 'Outfit', serif" font-size="16" font-weight="800" fill="url(#goldGrad)" letter-spacing="4">
    <textPath href="#topArch" startOffset="50%" text-anchor="middle">
      OFFICIAL DIGITAL PORTAL
    </textPath>
  </text>

  <text font-family="'Cinzel', 'Outfit', sans-serif" font-size="13.5" font-weight="700" fill="url(#goldGrad)" letter-spacing="4">
    <textPath href="#bottomArch" startOffset="50%" text-anchor="middle">
      &#x2022; INNOVATION &#x2022; EXCELLENCE &#x2022;
    </textPath>
  </text>

  <!-- Center Crest Circle -->
  <circle cx="200" cy="200" r="112" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#medallionShadow)"/>

  <!-- Stylized Digital Globe & Network Rings -->
  <circle cx="200" cy="200" r="72" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <ellipse cx="200" cy="200" rx="36" ry="72" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.85"/>
  <ellipse cx="200" cy="200" rx="72" ry="24" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.85"/>
  <line x1="128" y1="200" x2="272" y2="200" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="200" y1="128" x2="200" y2="272" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Center Core Starburst -->
  <circle cx="200" cy="200" r="9" fill="#FFF2A7"/>
  <circle cx="200" cy="200" r="15" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2, 3"/>

  <!-- Top 3 Golden Stars -->
  <polygon points="200,94 203,101 211,101 204,106 206,113 200,109 194,113 196,106 189,101 197,101" fill="url(#goldGrad)"/>
  <polygon points="178,99 180,105 186,105 181,109 183,115 178,111 173,115 175,109 170,105 176,105" fill="url(#goldGrad)"/>
  <polygon points="222,99 224,105 230,105 225,109 227,115 222,111 217,115 219,109 214,105 220,105" fill="url(#goldGrad)"/>

  <!-- Flanking Laurel Wreath Sprigs -->
  <g fill="url(#goldGrad)">
    <!-- Left Leaves -->
    <path d="M 104,170 Q 94,175 101,185 Q 107,178 104,170 Z"/>
    <path d="M 100,195 Q 90,201 98,211 Q 105,204 100,195 Z"/>
    <path d="M 104,222 Q 95,230 105,238 Q 110,230 104,222 Z"/>
    <path d="M 116,246 Q 109,256 122,262 Q 125,251 116,246 Z"/>

    <!-- Right Leaves -->
    <path d="M 296,170 Q 306,175 299,185 Q 293,178 296,170 Z"/>
    <path d="M 300,195 Q 310,201 302,211 Q 295,204 300,195 Z"/>
    <path d="M 296,222 Q 305,230 295,238 Q 290,230 296,222 Z"/>
    <path d="M 284,246 Q 291,256 278,262 Q 275,251 284,246 Z"/>
  </g>
</svg>
