<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Rich Golden Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A7"/>
      <stop offset="30%" stop-color="#E5B964"/>
      <stop offset="70%" stop-color="#C59338"/>
      <stop offset="100%" stop-color="#875914"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142445"/>
      <stop offset="50%" stop-color="#0E1933"/>
      <stop offset="100%" stop-color="#070D1B"/>
    </linearGradient>

    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5B964" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E5B964" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="195" fill="url(#glowGrad)"/>

  <!-- Outer Ring Base -->
  <circle cx="200" cy="200" r="185" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="7" filter="url(#shadow)"/>

  <!-- Inner Beaded Ring Pattern -->
  <circle cx="200" cy="200" r="168" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="3, 7"/>
  <circle cx="200" cy="200" r="156" fill="#0A1224" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Curved Text Path -->
  <path id="textCircleTop" d="M 60,200 A 140,140 0 1,1 340,200" fill="none"/>
  <path id="textCircleBottom" d="M 340,200 A 140,140 0 0,1 60,200" fill="none"/>

  <text font-family="'Cinzel', 'Playfair Display', serif" font-size="16.5" font-weight="800" fill="url(#goldGrad)" letter-spacing="3">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      APEX INSTITUTE OF TECHNOLOGY
    </textPath>
  </text>

  <text font-family="'Cinzel', 'Outfit', sans-serif" font-size="14.5" font-weight="700" fill="url(#goldGrad)" letter-spacing="4">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      &#x2022; ESTD. 1995 &#x2022; DEMO &#x2022;
    </textPath>
  </text>

  <!-- Central Crest Shield -->
  <path d="M 200,90 
           C 255,90 275,108 275,155 
           C 275,225 200,270 200,270 
           C 200,270 125,225 125,155 
           C 125,108 145,90 200,90 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)"/>

  <!-- Inner Shield Accent Line -->
  <path d="M 200,100 
           C 245,100 262,115 262,155 
           C 262,215 200,255 200,255 
           C 200,255 138,215 138,155 
           C 138,115 155,100 200,100 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4, 4"/>

  <!-- Classical Torch of Enlightenment -->
  <!-- Torch Handle -->
  <path d="M 194,180 L 206,180 L 202,230 L 198,230 Z" fill="url(#goldGrad)"/>
  <rect x="192" y="174" width="16" height="6" rx="2" fill="url(#goldGrad)"/>
  <path d="M 188,166 L 212,166 L 206,174 L 194,174 Z" fill="url(#goldGrad)"/>
  
  <!-- Flame -->
  <path d="M 200,132 
           C 208,144 216,152 210,165 
           C 204,168 196,168 190,165 
           C 184,152 192,144 200,132 Z" 
        fill="#FF9A26"/>
  <path d="M 200,140 
           C 204,148 208,154 205,163 
           C 201,165 198,165 195,163 
           C 192,154 196,148 200,140 Z" 
        fill="#FFE259"/>

  <!-- Open Book of Knowledge -->
  <!-- Left Page -->
  <path d="M 160,195 Q 180,190 200,198 L 200,218 Q 180,210 160,214 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M 165,200 Q 180,196 195,202" stroke="#102040" stroke-width="1.5" fill="none"/>
  <path d="M 165,205 Q 180,201 195,207" stroke="#102040" stroke-width="1.5" fill="none"/>
  
  <!-- Right Page -->
  <path d="M 240,195 Q 220,190 200,198 L 200,218 Q 220,210 240,214 Z" fill="#FFFFFF" opacity="0.95"/>
  <path d="M 235,200 Q 220,196 205,202" stroke="#102040" stroke-width="1.5" fill="none"/>
  <path d="M 235,205 Q 220,201 205,207" stroke="#102040" stroke-width="1.5" fill="none"/>

  <!-- Book Spine / Center -->
  <line x1="200" y1="197" x2="200" y2="218" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Golden 5-Pointed Stars Above Shield -->
  <polygon points="200,68 203,77 212,77 205,82 207,91 200,86 193,91 195,82 188,77 197,77" fill="url(#goldGrad)"/>
  <polygon points="174,74 176,81 183,81 177,85 179,92 174,88 169,92 171,85 165,81 172,81" fill="url(#goldGrad)"/>
  <polygon points="226,74 228,81 235,81 229,85 231,92 226,88 221,92 223,85 217,81 224,81" fill="url(#goldGrad)"/>

  <!-- Ornamental Laurel Wreath Leaves (Flanking the Shield) -->
  <g fill="url(#goldGrad)">
    <!-- Left Leaves -->
    <path d="M 115,145 Q 105,150 112,160 Q 118,154 115,145 Z"/>
    <path d="M 108,168 Q 98,175 106,184 Q 113,177 108,168 Z"/>
    <path d="M 107,194 Q 98,202 108,211 Q 113,203 107,194 Z"/>
    <path d="M 113,220 Q 106,230 117,237 Q 121,228 113,220 Z"/>
    <path d="M 127,244 Q 122,255 134,260 Q 137,250 127,244 Z"/>

    <!-- Right Leaves -->
    <path d="M 285,145 Q 295,150 288,160 Q 282,154 285,145 Z"/>
    <path d="M 292,168 Q 302,175 294,184 Q 287,177 292,168 Z"/>
    <path d="M 293,194 Q 302,202 292,211 Q 287,203 293,194 Z"/>
    <path d="M 287,220 Q 294,230 283,237 Q 279,228 287,220 Z"/>
    <path d="M 273,244 Q 278,255 266,260 Q 263,250 273,244 Z"/>
  </g>

  <!-- Lower Golden Ribbon Banner -->
  <g filter="url(#shadow)">
    <path d="M 120,295 L 140,285 L 260,285 L 280,295 L 270,312 L 200,312 L 130,312 Z" fill="#0A1224" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M 130,290 L 270,290 L 260,307 L 140,307 Z" fill="url(#goldGrad)"/>
    <text x="200" y="303" font-family="'Cinzel', 'Outfit', sans-serif" font-size="11.5" font-weight="900" fill="#070D1B" text-anchor="middle" letter-spacing="3">
      EXCELLENCE
    </text>
  </g>
</svg>
